; Native Vulkan GE on Linux / MoltenVK on macOS; SDL presentation and audio.
[Display]
Enabled=true
ResolutionMode=Desktop
Width=960
Height=544
Fullscreen=true
AspectRatio=Preserve
UpscaleFilter=Bilinear
IntegerScale=false
ShowFPS=true

[Rendering]
; F10 edits these live. Game preserves PSP sampling; On generates world mipmaps.
TextureFilter=Bilinear
Mipmapping=On
MipmapFilter=Linear
Backend=Vulkan
HardwareTransform=true
DX12GEColor=false
InternalResolutionMode=Desktop
MSAA=1
SMAA=false
AnisotropicFiltering=16

[Timing]
FrameRate=60
RealtimeSpeedDiagnostics=true
RealtimeSpeedIntervalVblanks=240

[Audio]
Enabled=true
Volume=70
Diagnostics=false
PrebufferBlocks=8
RecoveryPrebufferBlocks=14

[Widescreen]
Enabled=false

[Controls]
CameraStick=true
MouseSensitivity=12
InvertCameraY=false
ModernControlScheme=false

[Diagnostics]
LogToFile=true
LogFile=VCSNative.log
FlushEveryLine=true

; Optional PNG replacements; unmatched textures use original PSP assets.
[Textures]
Enabled=true
Directory=../textures/hdtextures

; Live world settings from the in-game F10 panel; 1.0 is stock.
[GraphicsDistance]
World=3
LOD=3

[rendering]
internalheight=544
internalscale=2
internalwidth=960
