; Native macOS/Linux bring-up: CPU rasterization, SDL presentation and audio.
[Display]
Enabled=true
ResolutionMode=Custom
Width=960
Height=544
Fullscreen=false
AspectRatio=Preserve
UpscaleFilter=Bilinear
IntegerScale=false
ShowFPS=false

[Rendering]
Backend=Software
HardwareTransform=false
DX12GEColor=false
InternalResolutionMode=PSP
MSAA=1
SMAA=false
AnisotropicFiltering=1

[Timing]
FrameRate=30
RealtimeSpeedDiagnostics=true
RealtimeSpeedIntervalVblanks=240

[Audio]
Enabled=true
Volume=70
Diagnostics=false
PrebufferBlocks=8
RecoveryPrebufferBlocks=14

[Widescreen]
Enabled=false

[Controls]
CameraStick=true
MouseSensitivity=12
InvertCameraY=false
ModernControlScheme=false

[Diagnostics]
LogToFile=true
LogFile=VCSNative.log
FlushEveryLine=true
